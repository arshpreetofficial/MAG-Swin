dataset:
  train: ADNI
  test: OASIS

image_size: 224

training:
  batch_size: 16
  epochs: 100
  optimizer: RMSprop
  learning_rate: 0.0001
  weight_decay: 0.00001

model:
  spectral_encoder: DFT_CNN
  spatial_encoder: SwinTransformer
  anatomical_encoder: MultiBranchCNN
  fusion: AttentionFusion

evaluation:
  metrics:
    - Accuracy
    - Sensitivity
    - Specificity
    - AUC

seed: 42
