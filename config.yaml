project:
  name: MAG-Swin
  task: Alzheimer disease classification

dataset:
  train_dataset: ADNI
  external_dataset: OASIS
  image_size: 224
  num_classes: 3
  classes:
    - CN
    - MCI
    - AD

training:
  epochs: 100
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: RMSprop
  loss: CrossEntropyLoss
  seed: 42

model:
  spectral_branch: true
  spatial_branch: true
  anatomical_branch: true
  fusion: attention
  dropout: 0.3

evaluation:
  metrics:
    - accuracy
    - sensitivity
    - specificity
    - auc
  cross_validation: 5
  statistical_test: Wilcoxon signed-rank test

paths:
  train_csv: data/train.csv
  val_csv: data/val.csv
  test_csv: data/test.csv
  checkpoint_dir: checkpoints
  results_dir: results
